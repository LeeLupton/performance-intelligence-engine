[package]
name = "idr-common-parity"
description = "Machine-local wire-format parity: the bridge vs the real idr_common types"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# MACHINE-LOCAL integration crate — deliberately NOT built in CI.
#
# The idr-common dependency points into the idr-main working tree, which is
# newer than the published github.com/leelupton/idr (the local tree carries
# ExternalTriage, TriageClassification, and the BgpAnomaly family the remote
# lacks). Adjust the path below if idr-main lives elsewhere on your machine.
[workspace]

[dependencies]
idr-common = { path = "../../../../CYBER/idr-main/idr-main/crates/idr-common" }
idr-intelligence-rt = { path = "../idr-intelligence-rt" }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
