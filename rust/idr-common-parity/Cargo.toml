[package]
name = "idr-common-parity"
description = "Machine-local wire-format parity: the bridge vs the real idr_common types"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Wire-compatibility proof: the bridge parses events serialized by the real
# idr_common types, and the committed goldens are valid idr-main wire format.
# idr-common is vendored in-repo (../idr-common), so this now builds in CI —
# no machine-local idr-main checkout required.
[workspace]

[dependencies]
idr-common = { path = "../idr-common" }  # vendored; see ../idr-common/VENDOR.md
idr-intelligence-rt = { path = "../idr-intelligence-rt" }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
