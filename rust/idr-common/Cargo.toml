[package]
name = "idr-common"
description = "Shared types, events, and protocols for the IDR system"
version = "0.1.0"
edition = "2024"
# Preserved from idr-main; NOT the repo's GPL-3.0-or-later. See VENDOR.md.
license = "GPL-2.0-only"

# Vendored verbatim from Lee's idr-main workspace (crates/idr-common) so the
# wire-compatibility proof builds in CI without a machine-local path. The
# workspace-inherited fields (version/edition/license/deps) are pinned here to
# the values idr-main uses. Its own [workspace] detaches it from this repo's
# other crates. Keep in sync with idr-main — see VENDOR.md.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
