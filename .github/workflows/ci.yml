name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install Arch Linux dependencies
        run: |
          # gcc provides /usr/bin/cc: the Rust build scripts need a linker, and
          # rustup (unlike the old `rust` package) does not pull one in.
          pacman -Syu --noconfirm \
            git \
            gcc \
            python \
            python-pip \
            python-setuptools \
            python-wheel \
            python-numpy \
            python-pytorch \
            python-scikit-learn \
            python-pytest \
            python-ruff \
            mypy \
            rustup

      - uses: actions/checkout@v4

      - name: Create virtual environment
        run: python -m venv --system-site-packages .venv

      - name: Install project
        run: .venv/bin/python -m pip install --no-deps -e .

      - name: Install ONNX export toolchain
        run: .venv/bin/python -m pip install onnx onnxruntime

      - name: Verify imports
        run: |
          .venv/bin/python - <<'PY'
          import numpy
          import sklearn
          import torch
          import idr_intelligence

          print("numpy:", numpy.__version__)
          print("scikit-learn:", sklearn.__version__)
          print("torch:", torch.__version__)
          print("idr-intelligence:", idr_intelligence.__file__)
          PY

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Run lint
        run: ruff check src tests

      - name: Run type check
        run: .venv/bin/python -m mypy src

      - name: Run benchmark floors
        run: cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/.venv/bin/python" -m idr_intelligence.cli benchmark --manifest "$GITHUB_WORKSPACE/benchmarks/v1.json"

      # rust/idr-common-parity is machine-local (path-dep on the idr-main
      # working tree) and deliberately not built here.
      # The toolchain is pinned by rust-toolchain.toml (rustup auto-installs
      # it), so clippy/rustfmt cannot drift with the Arch container.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Run Rust format check
        run: cargo fmt --check --manifest-path rust/idr-intelligence-rt/Cargo.toml

      - name: Run Rust lints
        run: cargo clippy --all-targets --manifest-path rust/idr-intelligence-rt/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust/idr-intelligence-rt/Cargo.toml
